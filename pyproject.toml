[project]
name = "btrfs-backup"
dynamic = ["version"]
description = "Backup chain: ext4 source -> local btrfs (rsync + snapshots) -> remote btrfs (send/receive)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carli* Freudenberg", email = "kound@posteo.de" },
]
keywords = [
    "backup",
    "btrfs",
    "snapshot",
    "rsync",
    "btrfs-send",
    "bitrot",
    "scrub",
    "systemd",
    "cli",
    "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/CarliJoy/btrfs-backup"
Documentation = "https://github.com/CarliJoy/btrfs-backup/blob/main/README.md"
Changelog = "https://github.com/CarliJoy/btrfs-backup/blob/main/CHANGELOG.md"
Issues = "https://github.com/CarliJoy/btrfs-backup/issues"
"Source Code" = "https://github.com/CarliJoy/btrfs-backup"

[project.scripts]
btrfs-backup = "btrfs_backup.cli:cli"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "prek>=0.5.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: __version__ in cli.py
[tool.hatch.version]
path = "src/btrfs_backup/cli.py"

[tool.hatch.build.targets.wheel]
packages = ["src/btrfs_backup"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings (incl. W505 doc line length)
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "UP",   # pyupgrade
    "FA",   # future annotations
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "SIM",  # simplify
    "PIE",  # misc lints
    "PTH",  # use pathlib
    "PERF", # performance anti-patterns
    "PL",   # pylint
    "RUF",  # ruff specific
    "S",    # bandit (security)
    "T20",  # no print
    "ERA",  # commented-out code
    "ARG",  # unused arguments
]
ignore = [
    "SIM108",  # explicit if/else blocks are preferred over ternary expressions
    "S603",    # subprocess is only called with fixed argument lists, never through a shell
    "S607",    # tools like btrfs, rsync, install are looked up via PATH on purpose
    "PLR0913", # click commands take one argument per option
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["btrfs_backup"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.mccabe]
max-complexity = 15
